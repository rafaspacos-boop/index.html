<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    
    <style>
        body{
             background-color: #50905a;
             display: flex;
             flex-direction: column;
             align-items: center;
         }
        
        #visualizer {
            width: 300px;
            height: 100px;
            background-color: #005e00;
            border-radius: 50px;
            margin-top: 30px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        } 
         .bar {
            width: 6px;
            height: 10px;
            background-color: lightblue;
            border-radius: 10px;
            }  
                
    </style>
    
</head>
<body>
    <h1>Audio Visualizer</h1>
    <input type="file" id="audioFile" accept="audio/*">
    <audio id="audio" controls></audio>
    <div id="visualizer">
    <div class="bar bar-1"></div>
    <div class="bar bar-2"></div>
    <div class="bar bar-3"></div>
    <div class="bar bar-4"></div>
    <div class="bar bar-5"></div>
    <div class="bar bar-6"></div>
    <div class="bar bar-7"></div>
    <div class="bar bar-8"></div>
    <div class="bar bar-9"></div>
    <div class="bar bar-10"></div>
    <div class="bar bar-11"></div>
    <div class="bar bar-12"></div>
    <div class="bar bar-13"></div>
    <div class="bar bar-14"></div>
    <div class="bar bar-15"></div>
    <div class="bar bar-16"></div>
    <div class="bar bar-17"></div>
    <div class="bar bar-18"></div>
    </div>
    
<script>
    let alleBalken = document.querySelectorAll(".bar");

    let audioDatei = document.querySelector("#audioFile");
    let audioPlayer = document.querySelector("#audio");

// AudioContext erstellen
    let audioContext = new AudioContext();

// Analyser erstellen 
    let analyser = audioContext.createAnalyser();

      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.85;

// Arrays erstellen
    let aktuelleHoehen = [];
    let zielHoehen = [];

// Messwerte speichern
    let daten = new Uint8Array(analyser.frequencyBinCount);

// Audioquelle erstellen
    let audioQuelle = audioContext.createMediaElementSource(audioPlayer);

// Audioverbindungen
    audioQuelle.connect(analyser);
    analyser.connect(audioContext.destination);

    let originalHoehen = Array(18).fill(10);

// Startwerte festlegen
    for (let i = 0; i < alleBalken.length; i++) {
      aktuelleHoehen[i] = originalHoehen[i];
      zielHoehen[i] = originalHoehen[i];
    }
// AudioContext aktivieren
    audioPlayer.addEventListener("play", function() {

    audioContext.resume();

    });

// Audiodatei laden
audioDatei.addEventListener("change", function() {

    let datei = audioDatei.files[0];

    audioPlayer.src = URL.createObjectURL(datei);

    });
    let empfindlichkeit = 1.2;
    let bassEmpfindlichkeit = 0.7;
    let gewichtungen = [
    0.15, 0.25, 0.35,
    0.45, 0.55, 0.65, 0.75, 0.85, 0.95,
    0.95, 0.85, 0.75, 0.65, 0.55, 0.45,
    0.50, 0.40, 0.30
];
setInterval(function() {
     if (audioPlayer.paused) {
        for (let i = 0; i < alleBalken.length; i++) {
            zielHoehen[i] = originalHoehen[i];
        }
        return;
    }

    analyser.getByteFrequencyData(daten);

    for (let i = 0; i < alleBalken.length; i++) {

       let start;
      let ende;
    let binBreite = audioContext.sampleRate / analyser.fftSize;
    let bassMitte = Math.ceil(75 / binBreite);
    let bassEnde = Math.ceil(150 / binBreite);
    if (i === 8) {
    start = 0;
    ende = bassMitte;
    } else if (i === 9) {
    start = bassMitte;
    ende = bassEnde;
    } else {
    let frequenzGruppe;
    if (i < 8) {
        frequenzGruppe = (7 - i) * 2;
    } else {
        frequenzGruppe = (i - 10) * 2 + 1;
    }
    start = bassEnde + Math.floor(frequenzGruppe * (daten.length - bassEnde) / 16);
    ende = bassEnde + Math.floor((frequenzGruppe + 1) * (daten.length - bassEnde) / 16);
    }
    let summe = 0;
    for (let j = start; j < ende; j++) {
    summe += daten[j];
    }
    let durchschnitt = summe / (ende - start);
        
       
        let gewichtung = gewichtungen[i];

        let bassFaktor = (i === 8 || i === 9) ? bassEmpfindlichkeit : 1;

        let verstaerkt = Math.min(durchschnitt * empfindlichkeit * gewichtung * bassFaktor, 255);

        zielHoehen[i] = 10 + verstaerkt / 255 * 55;
    }

    }, 50);

// Balken weich bewegen
function animation() {
    for (let i = 0; i < alleBalken.length; i++) {
        aktuelleHoehen[i] += (zielHoehen[i] - aktuelleHoehen[i]) * 0.5;
        alleBalken[i].style.height = aktuelleHoehen[i] + "px";
    }

    requestAnimationFrame(animation);
}

animation();

</script>
</body>
</html>
