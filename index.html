<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    
    <style>
        body{
             background-color: #50905a;
             display: flex;
             flex-direction: column;
             align-items: center;
         }
        
        #visualizer {
            width: 300px;
            height: 100px;
            background-color: #005e00;
            border-radius: 50px;
            margin-top: 30px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        } 
         .bar {
            width: 6px;
            height: 30px;
            background-color: lightblue;
            border-radius: 10px;
            animation: bewegen 1s infinite ease-in-out alternate;
            transition: height 0.15s ease;
            }  
         .bar-1 {
            height: 20px;
        }

        .bar-2 {
            height: 45px;
        }

        .bar-3 {
            height: 65px;
        }

        .bar-4 {
            height: 40px;
        }

        .bar-5 {
            height: 25px;
        }

        .bar-6 {
            height: 35px;
        }

        @keyframes bewegen {
            0% {
                transform: scaleY(0.5);
            }
            50% {
                transform: scaleY(1.5);
            }
            100% {
                transform: scaleY(0.5);
            }
            }
            .bar-1 {
                animation-delay: 0s;
            }
            .bar-2 {
                animation-delay: 0.1s;
            }
            .bar-3 {
                animation-delay: 0.2s;
            }
            .bar-4 {
                animation-delay: 0.3s;
            }
            .bar-5 {
                animation-delay: 0.4s;
            }
            .bar-6 {
                animation-delay: 0.5s;
                }                  
    </style>
    
</head>
<body>
    <h1>Audio Visualizer</h1>
    <input type="file" id="audioFile" accept="audio/*">
    <audio id="audio" controls></audio>
    <div id="visualizer">
    <div class="bar bar-1"></div>
    <div class="bar bar-2"></div>
    <div class="bar bar-3"></div>
    <div class="bar bar-4"></div>
    <div class="bar bar-5"></div>
    <div class="bar bar-6"></div>
    </div>
    
    <script>
          let alleBalken = document.querySelectorAll(".bar");
          let audioDatei = document.querySelector("#audioFile");
          let audioPlayer = document.querySelector("#audio");
          audioPlayer.addEventListener("play", function() {
          audioContext.resume();
          });
          let audioContext = new AudioContext();
          let analyser = audioContext.createAnalyser();
          let audioQuelle = audioContext.createMediaElementSource(audioPlayer);
          audioQuelle.connect(analyser);
          analyser.connect(audioContext.destination);
          audioDatei.addEventListener("change", function() {
          let datei = audioDatei.files[0];
          audioPlayer.src = URL.createObjectURL(datei);
          });
          
          console.log(audioDatei);
          console.log(audioPlayer);
        
        let aktuelleHoehen = [];
        let zielHoehen = [];

        // Startwerte festlegen
        for (let i = 0; i < alleBalken.length; i++) {

            aktuelleHoehen[i] = 30;

            zielHoehen[i] = Math.random() * 50 + 10;

        }

        // Regelmäßig neue Zielhöhen erzeugen
        setInterval(function() {

            for (let i = 0; i < alleBalken.length; i++) {

                zielHoehen[i] = Math.random() * 50 + 10;

            }

        }, 600);

        // Balken weich bewegen
        setInterval(function() {

            for (let i = 0; i < alleBalken.length; i++) {

                aktuelleHoehen[i] += (zielHoehen[i] - aktuelleHoehen[i]) * 0.1;

                alleBalken[i].style.height = aktuelleHoehen[i] + "px";

            }

        }, 16);

    </script>
</body>
</html>
