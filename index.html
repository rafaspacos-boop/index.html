<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    
    <style>
        body{
             background-color: #e6007a;
             display: flex;
             flex-direction: column;
             align-items: center;
         }
        
        #visualizer {
            width: 300px;
            height: 100px;
            background-color: #1e293b;
            border-radius: 50px;
            margin-top: 30px;
            
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        } 
         .bar {
            width: 6px;
            height: 30px;
            background-color: white;
            border-radius: 10px;
            animation: bewegen 1s infinite ease-in-out alternate;
            }  
         .bar-1 {
            height: 20px;
        }

        .bar-2 {
            height: 45px;
        }

        .bar-3 {
            height: 65px;
        }

        .bar-4 {
            height: 40px;
        }

        .bar-5 {
            height: 25px;
        }

        .bar-6 {
            height: 35px;
        }

        @keyframes bewegen {
            0% {
                transform: scaleY(0.5);
            }

            50% {
                transform: scaleY(1.5);
            }

            100% {
                transform: scaleY(0.5);
            }
        }

        .bar-1 {
            animation-delay: 0s;
        }

        .bar-2 {
            animation-delay: 0.1s;
        }

        .bar-3 {
            animation-delay: 0.2s;
        }

        .bar-4 {
            animation-delay: 0.3s;
        }

        .bar-5 {
            animation-delay: 0.4s;
        }

        .bar-6 {
            animation-delay: 0.5s;
        }                  
    </style>
    
</head>
<body>
    <h1>Audio Visualizer</h1>
    <div id="visualizer">
    <div class="bar bar-1"></div>
    <div class="bar bar-2"></div>
    <div class="bar bar-3"></div>
    <div class="bar bar-4"></div>
    <div class="bar bar-5"></div>
    <div class="bar bar-6"></div>
    </div>
    <script>
        console.log("Audio Visualizer gestartet");

        let lautstaerke = 50;
        lautstaerke = 80;

        console.log(lautstaerke);

        let balken = document.querySelector(".bar-1");

        console.log(balken);

        let neueHoehe = 60;
        balken.style.height = neueHoehe + "px";

        let alleBalken = document.querySelectorAll(".bar");

        console.log(alleBalken);
        for (let i = 0; i < alleBalken.length; i++) {
        alleBalken[i].style.height = "50px";
        }
    </script>
</body>
</html>
