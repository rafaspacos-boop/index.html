<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    
    <style>
        body{
             background-color: #111827;
             display: flex;
             flex-direction: column;
             align-items: center;
         }
        
        #visualizer {
            width: 300px;
            height: 100px;
            background-color: #1e293b;
            border-radius: 50px;
            margin-top: 30px;
        } 
         .bar {
            width: 12px;
            height: 30px;
            background-color: white;
            border-radius: 10px;
            }                 
    </style>
    
</head>
<body>
    <h1>Audio Visualizer</h1>
    <div id="visualizer">
    <div class="bar"></div>
    </div>
</body>
</html>
