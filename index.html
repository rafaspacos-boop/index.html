<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    
    <style>
        body{
             background-color: #333333;
             display: flex;
             flex-direction: column;
             align-items: center;
         }
        
         #visualizer {
            width: 300px;
            height: 100px;
            margin-top: 30px;
            }
            
         .bar {
            width: 6px;
            height: 10px;
            background-color: lightblue;
            border-radius: 10px;
            }  
                
    </style>
    
</head>
<body>
    <h1>Audio Visualizer</h1>
    <input type="file" id="audioFile" accept="audio/*">
    <audio id="audio" controls></audio>
    <canvas id="visualizer" width="600" height="200"></canvas>
    <label>
      <input type="checkbox" id="hintergrundAuswahl">
      Hintergrund mit aufnehmen
    </label>
    <button id="aufnahmeStarten">Aufnahme starten</button>
    <button id="aufnahmeStoppen">Aufnahme beenden</button>
    
<script type="module">

import * as Mediabunny from "https://esm.sh/mediabunny";
console.log("Mediabunny geladen:", Mediabunny);

async function testeCodecs() {
    const codecs = [
        "vp09.00.10.08",
        "vp8"
    ];

    for (const codec of codecs) {
        const ergebnis = await VideoEncoder.isConfigSupported({
            codec: codec,
            width: 600,
            height: 200,
            bitrate: 1000000,
            framerate: 30,
            alpha: "keep"
        });

        console.log(
            codec,
            "Unterstützt:",
            ergebnis.supported
        );
    }
}

testeCodecs();

console.log("VP9:", MediaRecorder.isTypeSupported("video/webm;codecs=vp9"));
console.log("VP8:", MediaRecorder.isTypeSupported("video/webm;codecs=vp8"));
console.log("WebM:", MediaRecorder.isTypeSupported("video/webm"));

console.log("VideoEncoder:", typeof VideoEncoder);
console.log("VideoFrame:", typeof VideoFrame);
console.log("AudioEncoder:", typeof AudioEncoder);

const testEncoder = new VideoEncoder({
    output() {},
    error(error) {
        console.error("Encoder-Fehler:", error);
    }
});

try {
    testEncoder.configure({
        codec: "vp09.00.10.08",
        width: 600,
        height: 200,
        bitrate: 1000000,
        framerate: 30,
        alpha: "keep"
    });

    console.log("VP9-Encoder erfolgreich konfiguriert!");
} catch (error) {
    console.error("Konfiguration fehlgeschlagen:", error);
}

// HTML-Elemente auswählen
const canvas = document.querySelector("#visualizer");
const ctx = canvas.getContext("2d");

const hintergrundAuswahl = document.querySelector("#hintergrundAuswahl");
const audioDatei = document.querySelector("#audioFile");
const audioPlayer = document.querySelector("#audio");

const aufnahmeStarten = document.querySelector("#aufnahmeStarten");
const aufnahmeStoppen = document.querySelector("#aufnahmeStoppen");

// Grundeinstellungen
const anzahlBalken = 18;
const aktuelleHoehen = [];
const zielHoehen = [];

const audioContext = new AudioContext();
const analyser = audioContext.createAnalyser();

analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.85;

const daten = new Uint8Array(analyser.frequencyBinCount);

// Audioquelle erstellen
const audioQuelle = audioContext.createMediaElementSource(audioPlayer);

// Audioverbindungen
audioQuelle.connect(analyser);
analyser.connect(audioContext.destination);

// Audio für die Aufnahme bereitstellen
const aufnahmeAudio = audioContext.createMediaStreamDestination();
// Video-Ausgabe vorbereiten
const output = new Mediabunny.Output({
    format: new Mediabunny.WebMOutputFormat(),
    target: new Mediabunny.BufferTarget()
});

// Visualizer als Videoquelle
const videoQuelle = new Mediabunny.CanvasSource(canvas, {
    codec: "vp9",
    quality: new Mediabunny.Quality("medium"),
    alpha: "keep"
});

// Audio als Tonquelle
const audioQuelleExport = new Mediabunny.MediaStreamAudioTrackSource(
    aufnahmeAudio.stream.getAudioTracks()[0],
    {
        codec: "opus",
        quality: new Mediabunny.Quality("medium")
    }
);

// Quellen zur Ausgabe hinzufügen
output.addVideoTrack(videoQuelle, {
    frameRate: 30
});

output.addAudioTrack(audioQuelleExport);

console.log("Export vorbereitet!");

// Aufnahme vorbereiten
let aufnahmeAktiv = false;
let frameZaehler = 0;

// Einzelne Videoframes aufnehmen
async function aufnahmeFrameLoop() {
  // Aufnahme starten
aufnahmeStarten.addEventListener("click", async function() {
    console.log("Button wurde geklickt!");

    try {
        await audioContext.resume();
        await exportiereVideo();
        await audioPlayer.play();

        console.log("Aufnahme läuft!");
    } catch (fehler) {
        console.error("Startfehler:", fehler);
    }
});
    if (!aufnahmeAktiv) return;

    await videoQuelle.add(
        frameZaehler / 30,
        1 / 30
    );

    frameZaehler++;

    setTimeout(aufnahmeFrameLoop, 1000 / 30);
}

// Export starten
async function exportiereVideo() {
    await output.start();

    aufnahmeAktiv = true;
    frameZaehler = 0;

    aufnahmeFrameLoop();

    console.log("Aufnahme läuft!");
}

analyser.connect(aufnahmeAudio);

// Video vom Canvas aufnehmen
const videoStream = canvas.captureStream(30);

// Audio und Video zusammenführen
const kombinierterStream = new MediaStream([
    ...videoStream.getVideoTracks(),
    ...aufnahmeAudio.stream.getAudioTracks()
]);

// Recorder erstellen – Browser wählt das Format selbst
const recorder = new MediaRecorder(kombinierterStream);

recorder.addEventListener("dataavailable", function(event) {
    if (event.data.size > 0) {
        aufnahmeDaten.push(event.data);
    }
});

// Aufnahme herunterladen
recorder.addEventListener("stop", function() {
    const videoDatei = new Blob(aufnahmeDaten, {
        type: recorder.mimeType
    });

    const downloadURL = URL.createObjectURL(videoDatei);

    const downloadLink = document.createElement("a");
    downloadLink.href = downloadURL;
    downloadLink.download = "Audio-Visualizer.webm";
    downloadLink.click();

    setTimeout(function() {
        URL.revokeObjectURL(downloadURL);
    }, 1000);
});

// Aufnahme starten
aufnahmeStarten.addEventListener("click", async function() {
    await audioContext.resume();

    if (recorder.state === "inactive") {
        aufnahmeDaten.length = 0;
        recorder.start();
    }
});

// Aufnahme beenden
aufnahmeStoppen.addEventListener("click", function() {
    if (recorder.state === "recording") {
        recorder.stop();
    }
});

// Aufnahmedaten speichern
const aufnahmeDaten = [];

recorder.addEventListener("dataavailable", function(event) {
    if (event.data.size > 0) {
        aufnahmeDaten.push(event.data);
    }
});

// Aufnahme herunterladen
recorder.addEventListener("stop", function() {
    const videoDatei = new Blob(aufnahmeDaten, {
        type: recorder.mimeType
    });

    const downloadURL = URL.createObjectURL(videoDatei);

    const downloadLink = document.createElement("a");
    downloadLink.href = downloadURL;
    downloadLink.download = "Audio-Visualizer.webm";
    downloadLink.click();

    setTimeout(function() {
        URL.revokeObjectURL(downloadURL);
    }, 1000);
});

// Aufnahme starten
aufnahmeStarten.addEventListener("click", async function() {
    await audioContext.resume();

    if (recorder.state === "inactive") {
        aufnahmeDaten.length = 0;
        recorder.start();
    }
});

// Aufnahme beenden
aufnahmeStoppen.addEventListener("click", function() {
    if (recorder.state === "recording") {
        recorder.stop();
    }
});

// Startwerte der Balken
const originalHoehen = Array(18).fill(10);

for (let i = 0; i < anzahlBalken; i++) {
    aktuelleHoehen[i] = originalHoehen[i];
    zielHoehen[i] = originalHoehen[i];
}

// AudioContext aktivieren
audioPlayer.addEventListener("play", function() {
    audioContext.resume();
});

// Audiodatei laden
audioDatei.addEventListener("change", function() {
    const datei = audioDatei.files[0];

    if (datei) {
        audioPlayer.src = URL.createObjectURL(datei);
    }
});

// Empfindlichkeit
const empfindlichkeit = 1.2;
const bassEmpfindlichkeit = 0.7;

const gewichtungen = [
    0.15, 0.25, 0.35,
    0.45, 0.55, 0.65, 0.75, 0.85, 0.95,
    0.95, 0.85, 0.75, 0.65, 0.55, 0.45,
    0.50, 0.40, 0.30
];

const binBreite = audioContext.sampleRate / analyser.fftSize;

// Audio analysieren
function analysiereAudio() {
    if (audioPlayer.paused) {
        for (let i = 0; i < anzahlBalken; i++) {
            zielHoehen[i] = originalHoehen[i];
        }
        return;
    }

    analyser.getByteFrequencyData(daten);

    for (let i = 0; i < anzahlBalken; i++) {
        let start;
        let ende;

        let bassMitte = Math.ceil(75 / binBreite);
        let bassEnde = Math.ceil(150 / binBreite);

        if (i === 8) {
            start = 0;
            ende = bassMitte;
        } else if (i === 9) {
            start = bassMitte;
            ende = bassEnde;
        } else {
            let frequenzGruppe;

            if (i < 8) {
                frequenzGruppe = (7 - i) * 2;
            } else {
                frequenzGruppe = (i - 10) * 2 + 1;
            }

            start = bassEnde + Math.floor(
                frequenzGruppe * (daten.length - bassEnde) / 16
            );

            ende = bassEnde + Math.floor(
                (frequenzGruppe + 1) * (daten.length - bassEnde) / 16
            );
        }

        let summe = 0;

        for (let j = start; j < ende; j++) {
            summe += daten[j];
        }

        let durchschnitt = summe / (ende - start);
        let gewichtung = gewichtungen[i];

        let bassFaktor = (i === 8 || i === 9)
            ? bassEmpfindlichkeit
            : 1;

        let verstaerkt = Math.min(
            durchschnitt * empfindlichkeit * gewichtung * bassFaktor,
            255
        );

        zielHoehen[i] = 10 + verstaerkt / 255 * 55;
    }
}

// Hintergrundauswahl
let mitHintergrund = false;

hintergrundAuswahl.addEventListener("change", function() {
    mitHintergrund = hintergrundAuswahl.checked;
});

// Visualizer zeichnen
function zeichneVisualizer() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (mitHintergrund) {
        ctx.fillStyle = "#50905a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Oval zeichnen
    ctx.beginPath();
    ctx.ellipse(300, 100, 300, 100, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#005e00";
    ctx.fill();

    // Balken zeichnen
    for (let i = 0; i < anzahlBalken; i++) {
        let breite = 12;
        let abstand = 10;

        let x = 107 + i * (breite + abstand);
        let hoehe = aktuelleHoehen[i] * 2;

        ctx.beginPath();
        ctx.roundRect(
            x,
            100 - hoehe / 2,
            breite,
            hoehe,
            10
        );

        ctx.fillStyle = "lightblue";
        ctx.fill();
    }
}

// Balken weich bewegen
let letzteFrameZeit = 0;
let restFaktor = 0.5;

function animation(zeit) {
    analysiereAudio();

    let deltaZeit = Math.min(zeit - letzteFrameZeit, 50);
    let weichheit = 1 - Math.pow(restFaktor, deltaZeit / 16.67);

    letzteFrameZeit = zeit;

    for (let i = 0; i < anzahlBalken; i++) {
        aktuelleHoehen[i] +=
            (zielHoehen[i] - aktuelleHoehen[i]) * weichheit;
    }

    zeichneVisualizer();

    requestAnimationFrame(animation);
}

requestAnimationFrame(animation);
</script>
</body>
</html>
